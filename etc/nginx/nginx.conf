user nginx nginx;
worker_processes auto;

# Send error logs to `journald`
error_log syslog:server=unix:/dev/log,tag=nginx,nohostname;

include modules-enabled/*.conf;

events {
	# NGINX refuses to start if the 'events' section is not present. Yet,
	# NGINX does not seem to care whether this section is non-empty.
}

http {
	# Maximum hash table size is increased to accommodate for a large
	# mime.types file that is shipped on Gentoo.
	types_hash_max_size 4096;
	include mime.types.nginx;

	# Enable the use of `sendfile()` to allow NGINX to pass file
	# descriptors directly to the network socket
	sendfile on;

	# Share sessions between all workers
	ssl_session_cache shared:SSL:10m;

	# Send access logs to `journald`
	access_log syslog:server=unix:/dev/log,tag=nginx,nohostname;

	include /etc/nginx/conf.d/*.conf;
}
