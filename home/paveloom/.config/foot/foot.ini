[main]
shell=/usr/bin/fish
font=monospace:size=14
initial-color-theme=light

[key-bindings]
spawn-terminal=Control+Shift+t

# Based on the light GNOME palette that Ptyxis ships:
# https://gitlab.gnome.org/chergert/ptyxis/-/blob/main/src/palettes/gnome.palette
#
# See also:
# https://gnome.pages.gitlab.gnome.org/libadwaita/doc/1-latest/css-variables.html

[colors-light]
background=ffffff
foreground=1d1d20

selection-background=3584e4
selection-foreground=ffffff

# ANSI colors:
# Black, Red, Green, Yellow, Blue, Magenta, Cyan, White

regular0=1d1d20
regular1=c01c28
regular2=26a269
regular3=a2734c
regular4=12488b
regular5=a347ba
regular6=2aa1b3
regular7=cfcfcf

bright0=5d5d5d
bright1=f66151
bright2=33d17a
bright3=e9ad0c
bright4=2a7bde
bright5=c061cb
bright6=33c7de
bright7=ffffff
